function home(){const shortcuts=[['message-circle','Start a new chat','Ask, plan and solve problems','chat','blue'],['network','Create an agent','Configure a specialist assistant','agents','violet'],['search','Start research','Explore a topic with sources','research','green'],['bolt','Set up automation','Schedule repeatable work','automations','orange']];const tools=[['globe','Web search'],['code','CodeQ'],['folder','Files'],['terminal','Developer'],['book-open','Knowledge'],['calendar','Calendar']];return `<div class="page"><div class="home-grid"><section><div class="home-intro">${square('sun','orange')}<div><h1>Welcome to OpenAgent</h1><p>What would you like to work on?</p></div></div><div class="home-composer"><textarea id="home-prompt" aria-label="Ask OpenAgent" placeholder="Ask OpenAgent anything..."></textarea><div class="composer-tools">${button(icon('plus'),'attachDemo','sm icon-only')}${['Agents','Web','Files','Research','CodeQ'].map((t,i)=>button(`${icon(['network','globe','folder','search','code'][i],'xs')} ${t}`,`quick:${['agents','research','files','research','codeq'][i]}`,'sm')).join('')}<button class="send-button" data-action="homeSend" title="Open this in chat">${icon('send')}</button></div></div><div class="grid-4 section-space">${shortcuts.map(([ico,title,desc,route,tone])=>`<div class="card shortcut-card hover-card" role="button" tabindex="0" data-nav="${route}">${square(ico,tone)}<h3>${title}</h3><p>${desc}</p></div>`).join('')}</div><div class="section-head section-space"><h2>${icon('box')} Projects</h2><button class="text-link" data-action="projectPicker">View projects ${icon('arrow-right','xs')}</button></div><div class="grid-4">${F.projects.map(p=>`<div class="card project-card hover-card" data-action="openProject" data-value="${esc(p.name)}">${square('folder',p.color,'sm')}<h3>${esc(p.name)}</h3><p class="muted small truncate">${esc(p.tag)}</p><div class="row between section-space"><span class="caption">${esc(p.updated)}</span>${icon('more-horizontal','sm')}</div></div>`).join('')}</div><div class="section-head section-space"><h2>${icon('clock')} Recent activity</h2><button class="text-link" data-action="palette">View all</button></div><div class="card activity-list">${F.activity.map(a=>`<div class="list-row">${square(a.icon,a.tone,'sm')}<div class="flex1"><div class="row-title">${esc(a.title)}</div><div class="row-sub">${esc(a.detail)}</div></div><span class="caption">${esc(a.time)}</span></div>`).join('')}</div></section><aside class="right-stack home-right"><div class="card"><div class="section-head"><h2>${icon('check-circle')} Today</h2><button class="text-link" data-nav="calendar">Calendar</button></div>${['Review product requirements','Check research findings','Prepare launch recommendations','Update documentation'].map((t,i)=>`<label class="task-check"><input type="checkbox" class="checkbox" ${i<2?'checked':''}><span class="flex1">${t}</span>${i<2?badge('Done','green'):''}</label>`).join('')}</div><div class="card"><div class="section-head"><h2>${icon('network')} Your agents</h2><button class="text-link" data-nav="agents">View all</button></div>${F.agents.map(a=>`<div class="agent-mini">${square(a.icon,a.tone,'sm')}<div class="flex1"><div class="agent-name">${a.name}</div><div class="caption">${a.role}</div></div><span class="status-dot" title="Illustration only"></span></div>`).join('')}</div><div class="card"><div class="section-head"><h2>${icon('layers')} Pinned tools</h2><button class="text-link" data-action="palette">Edit</button></div><div class="tool-grid">${tools.map(([ico,label])=>`<button class="tool-tile" data-nav="${label==='Web search'?'research':label==='CodeQ'?'codeq':label==='Files'?'files':label==='Developer'?'developer':label==='Knowledge'?'knowledge':'calendar'}">${icon(ico,'lg')}${label}</button>`).join('')}</div></div>${demoMarker()}</aside></div></div>`}
function renderMessages(){const examples=[{sender:'You',initial:'M',time:'10:24',body:'I’m working on a frontend project and would like to improve its structure and visual design.'},{sender:'OpenAgent',initial:'',time:'10:24',body:`<p>Here is a practical direction for a cleaner, more usable interface.</p><h3>1. Simplify the navigation</h3><div class="message-note">Group related tools, keep a clear main task, and show advanced options only where they help.</div><h3>2. Establish a consistent component system</h3><div class="message-note"><strong>Information hierarchy</strong><p>Readable headings, restrained panels and accessible controls.</p><br><strong>Visual language</strong><p>Shared spacing, typography, feedback, and state-driven animations.</p></div><h3>3. Keep workflows connected</h3><p>Let users move between chat, files, agents, research and code without losing context.</p>`}];return [...examples,...state.chatMessages].map(m=>`<article class="chat-message"><span class="avatar ${m.sender==='You'?'':'blue'}">${m.sender==='You'?'M':'◉'}</span><div class="flex1"><div class="message-head"><strong>${esc(m.sender)}</strong><small>${esc(m.time)}</small></div><div class="message-body">${m.html?m.body:m.sender==='OpenAgent'?m.body:`<p>${esc(m.body)}</p>`}</div>${m.sender==='OpenAgent'?`<div class="message-actions">${iconbtn('copy','copyAnswer','Copy message')}${iconbtn('thumbs','feedback','Useful response')}${iconbtn('more-horizontal','feedback','More actions')}</div>`:''}</div></article>`).join('')}
function chatInspector(){return `<aside class="inspector"><div class="inspector-tabs">${tabbar(['Files','Preview','Context'],state.chatTab,'chatInspector')}</div><div class="inspector-content">${state.chatTab==='Files'?`<div class="section-head"><h3>Project files</h3>${iconbtn('plus','attachDemo','Add files')}</div>${fileTree()}`:state.chatTab==='Preview'?`<div class="row between" style="margin-bottom:12px"><span class="tag">${icon('globe','xs')} Web preview</span><div class="row gap4">${iconbtn('monitor','feedback','Desktop preview')}${iconbtn('maximize','feedback','Expand preview')}</div></div><div class="browser-preview"><div class="mock-nav"><strong>◉ OpenAgent</strong><span>Product · Docs · Start</span></div><h2>Build better work with AI</h2><p>One workspace for research, planning and development.</p>${button('Explore workspace →','quick:home','primary sm')}<div style="height:86px;border-radius:9px;margin-top:32px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue)">${icon('layers','hero')}</div></div><div class="card padded section-space"><h3>Design notes</h3><p class="small muted" style="margin-top:8px">Use a consistent navigation pattern, sensible content widths, and purposeful detail panels.</p></div>`:`<div class="card padded"><h3>Conversation context</h3><p class="muted small" style="margin:9px 0 16px">Project: ${esc(state.project)}</p><div class="list-row">${icon('folder')} <span class="flex1">Project files</span>${badge('6 items')}</div><div class="list-row">${icon('bot')} <span class="flex1">Selected model</span>${badge(state.modelSelected)}</div><div class="list-row">${icon('shield')} <span class="flex1">Privacy mode</span>${badge('Preview')}</div></div>`}</div></aside>`}
function chat(){return `<div class="split-layout"><section class="split-main"><header class="split-top"><div class="row"><strong>Frontend redesign</strong>${badge('Design conversation')}</div><div class="row">${iconbtn('panel-right','toggleChatInspector','Toggle context panel')}${iconbtn('more-horizontal','feedback','Conversation options')}</div></header><div class="split-scroll" id="chat-scroll"><div class="chat-thread">${renderMessages()}</div></div><div class="chat-composer-outer"><div class="chat-composer"><textarea id="chat-input" placeholder="Message OpenAgent..." aria-label="Message OpenAgent"></textarea><div class="row between" style="flex-wrap:wrap"><div class="row gap6">${iconbtn('paperclip','attachDemo','Attach a file')}${button(`${icon('bot','xs')} ${esc(state.modelSelected)}`,'modelPicker','sm')}${button(`${icon('globe','xs')} Tools`,'palette','sm')}</div><button class="send-button" data-action="sendChat" aria-label="Send message">${icon('send')}</button></div></div></div></section>${state.showChatInspector?chatInspector():''}</div>`}
function fileTree(){return `<div class="file-tree"><div class="tree-row">${icon('down','xs')}${icon('folder','sm')} <strong>ecommerce-platform</strong></div>${['src','components','ProductCard.tsx','hooks','useCart.ts','pages','page.tsx','styles','package.json','README.md'].map((n,i)=>`<div class="tree-row ${[0,5,7].includes(i)?'level1':'level2'} ${n==='ProductCard.tsx'?'active':''}" data-action="fileFromTree" data-value="${esc(n)}">${icon(n.includes('.')?'file-code':'folder','sm')}${esc(n)}</div>`).join('')}</div>`}
function agentLane(a,index){let texts=[['I’ve divided the work into clear tasks. The team can review each area before a final decision.','The findings from each specialist will be combined into one recommendation.'],['I’m comparing documented capabilities and evidence sources.','I’ve grouped key findings with their supporting sources.'],['I’ve reviewed the proposed component changes and identified areas for testing.','Changes are ready to inspect before any files are modified.']];return `<section class="agent-lane ${state.agentMobileTab===index?'mobile-selected':''}"><header class="lane-head"><div class="row">${square(a.icon,a.tone)}<div class="flex1"><h3>${a.name}</h3><p class="caption">${a.role}</p></div><span class="status-dot"></span>${iconbtn('more-horizontal','feedback','Agent actions')}</div></header><div class="lane-body"><div class="lane-message"><div class="row">${square(a.icon,a.tone,'sm')}<strong>${a.name}</strong><span class="caption">Preview message</span></div><p>${texts[index][0]}</p></div><div class="lane-note"><h3>${['Task plan','Research notes','Proposed code review'][index]}</h3>${index===0?`<div class="task-list">${['Gather information','Analyse and discuss','Prepare recommendation','Finalise report'].map((t,i)=>`<label><input type="checkbox" ${i===0?'checked':''}>${t}</label>`).join('')}</div>`:index===1?`<p>Key findings</p><p>• Clear demand for reliable tools<br>• Integration quality matters<br>• Privacy needs explicit controls</p>`:`<div class="code-sample"><pre>src/components/ProductCard.tsx\n\n<span style="color:var(--green)">+ Add component tests</span>\n<span style="color:var(--green)">+ Handle loading states</span></pre></div>`}</div><div class="lane-message"><div class="row">${square(a.icon,a.tone,'sm')}<strong>${a.name}</strong><span class="caption">Preview message</span></div><p>${texts[index][1]}</p></div></div><div class="chat-composer-outer"><div class="chat-composer"><textarea placeholder="Message ${a.name}..." aria-label="Message function agentContext(){return `<aside class="agent-context ${state.agentMobileTab===3?'mobile-selected':''}"><div class="section-head"><h3>Tasks</h3>${button(`${icon('plus','xs')} Add`,'openTaskModal','sm')}</div><p class="caption">3 of 6 complete · Example workflow</p><div class="progress"><span style="width:50%"></span></div><div class="task-list">${['Gather market feedback','Review recent changes','Analyse competitor activity','Assess risks and opportunities','Prepare launch recommendation','Create final report'].map((t,i)=>`<label><input type="checkbox" ${i<3?'checked':''}><span>${t}<div class="caption">${i<3?['Researcher','Developer','Researcher'][i]:'Coordinator'}</div></span></label>`).join('')}</div><div class="divider"></div><div class="section-head"><h3>Shared files</h3>${iconbtn('plus','attachDemo','Attach a shared file')}</div>${['Launch plan draft','Market analysis.pdf','Competitor comparison.xlsx'].map(f=>`<div class="row">${square('file-text','blue','sm')}<div class="flex1"><strong class="small">${f}</strong><div class="caption">Illustration only</div></div></div>`).join('')}<div class="note-panel">${icon('info','sm')} This is a multi-agent interaction preview. Real progress requires durable backend run events.</div></aside>`}
function agents(){return `<div class="split-main">${state.agentsTab==='Session'?`<div class="agent-top"><div class="row between"><div class="row" style="gap:15px">${square('target','blue')}<div><h1 style="font-size:24px">Product launch review</h1><p class="muted small">Example multi-agent workflow with clear task ownership.</p></div></div><div class="row">${badge('Illustrative session','orange')}${button('Agent directory','agentsDirectory','sm')}${button(`${icon(state.activeRun?'pause':'play','sm')} ${state.activeRun?'Stop preview':'Preview activity'}`,'previewRun','sm')}</div></div><div class="steps-line">${['Gather information','Analyse and discuss','Prepare recommendation','Finalise report'].map((s,i)=>`<div class="step ${i===0?'complete':i===1?'active':''}"><strong>${i+1}. ${s}</strong><div>${i===0?'Complete':i===1?'In progress (illustration)':'Pending'}</div></div>`).join('')}</div><div class="agent-mobile-tabs">${['Coordinator','Researcher','Developer','Tasks'].map((x,i)=>`<button class="btn sm ${state.agentMobileTab===i?'soft':''}" data-action="mobileAgent" data-value="${i}">${x}</button>`).join('')}</div></div><div class="agent-board">${F.agents.slice(0,3).map(agentLane).join('')}${agentContext()}</div>`:`<div class="page">${head('AI agents','Find the right specialist for a task, or configure a new one.',button('View example session','agentsSession','sm')+button(`${icon('plus','sm')} New agent`,'openAgentModal','primary'))}${searchbox('Search agents...','agents')}<div class="section-space agent-directory">${F.agents.map(a=>`<div class="card directory-card">${square(a.icon,a.tone)}<div class="flex1"><div class="row between"><h3>${a.name}</h3>${badge(a.status,'green')}</div><p class="muted small" style="margin:7px 0 15px">${a.role}</p>${button('View sample workflow','agentsSession','sm soft')}</div></div>`).join('')}</div>${demoMarker()}</div>`}</div>`}
function research(){return `<div class="research-shell"><section class="research-article"><div class="row between align-start"><div class="row align-start">${square('file-text','blue')}<div><h1>Open-source AI agents</h1><div class="row section-space" style="margin-top:8px">${badge('Example report','blue')}<span class="muted small">Research workspace</span></div></div></div>${button(`${icon('download','sm')} Export`,'demoExport','sm')}</div><p class="intro">An example research report layout with readable findings, supporting evidence, and persistent source context.</p>${tabbar(['Summary','Findings','Sources','Notes'],state.researchTab,'research')}<div id="research-body">${state.researchTab==='Summary'?`<div class="card research-summary"><h2>Executive summary</h2><p style="margin-top:9px">Agent frameworks are increasingly designed around structured tool use, coordination, and external data access. A production system should make source quality, permissions, and run progress easy to understand. This sample demonstrates the content layout; it is not a verified research result.</p></div><div class="stats-grid"><div class="stat-box"><strong>14</strong><span class="caption">Example sources</span></div><div class="stat-box"><strong>5</strong><span class="caption">Finding sections</span></div><div class="stat-box"><strong>3</strong><span class="caption">Review actions</span></div><div class="stat-box"><strong>—</strong><span class="caption">Live run time unavailable</span></div></div><div class="section-head"><h2>Key findings</h2><button class="text-link" data-tab-kind="research" data-tab="Findings">View all</button></div>${researchFindings()}`:state.researchTab==='Findings'?researchFindings():state.researchTab==='Sources'?F.researchSources.map(s=>`<div class="card padded" style="margin-bottom:10px">${icon('external-link')} <strong>${esc(s.title)}</strong><p class="muted small">${esc(s.site)}</p></div>`).join(''):`<div class="card padded"><h3>Research notes</h3><textarea id="demo-research-note" class="textarea" rows="7" placeholder="Add your review notes..." style="margin-top:12px">${esc(state.researchNote||'')}</textarea>${button('Save note','coreSaveResearchNote','sm section-space')}</div>`}</div></section><aside class="research-side">${tabbar(['Sources','Notes','Activity'],state.researchSideTab,'researchSide')}${state.researchSideTab==='Sources'?`<div class="section-head"><h3>Sources (example)</h3>${iconbtn('more-horizontal','feedback','Source actions')}</div>${searchbox('Find a source...','sources')}<div class="section-space">${F.researchSources.map(s=>`<div class="source-row">${square('file-text','blue','sm')}<div class="flex1"><strong>${esc(s.title)}</strong><small>${esc(s.site)} · ${esc(s.date)}</small></div>${icon('external-link','sm')}</div>`).join('')}</div>`:state.researchSideTab==='Notes'?`<div class="card padded"><h3>Source notes</h3><p class="muted small" style="margin:8px 0">Keep notes next to the report while reviewing evidence.</p><textarea class="textarea" rows="6" placeholder="Add a note..."></textarea></div>`:`<div class="section-head"><h3>Research stages</h3></div><div class="timeline">${['Analyse question','Discover sources','Read and extract','Compare findings','Compile report'].map(s=>`<div class="timeline-row"><span class="timeline-mark">${icon('check','xs')}</span>${s}</div>`).join('')}</div>`}<div class="divider section-space"></div><div class="section-head section-space"><h3>Run details</h3></div><div class="timeline">${['Question scoped','Sources considered','Evidence reviewed','Findings prepared','Report composed'].map(s=>`<div class="timeline-row"><span class="timeline-mark">${icon('check','xs')}</span>${s}</div>`).join('')}</div><div style="margin-top:16px">${button(`${icon('play','xs')} Preview running state`,'previewRun','sm soft')}</div></aside></div>`}
function researchFindings(){return [['Source transparency is critical','AI-assisted research is most useful when claims can be checked against original references.'],['Permission boundaries improve trust','Agents should disclose tools, requested access and expected actions before they proceed.'],['A single coherent workspace reduces context switching','Chat, files, execution and reporting should share the same project context.']].map((p,i)=>`<article class="card finding-card"><span class="finding-number">${i+1}</span><div><h3>${p[0]}</h3><p class="muted small" style="margin:5px 0 9px">${p[1]}</p>${badge('Design principle','blue')} <button class="text-link" data-tab-kind="researchSide" data-tab="Sources" style="margin-left:7px">View sources →</button></div></article>`).join('')}

 if(tab==='Collections')main=`<div class="p-section-intro"><h2>Collections</h2><p>Keep connected sources organised by purpose and project.</p></div><div class="p-mini-grid">${collections.map(([n,s,ic,m])=>`<button class="p-collection" data-action="pInspect" data-value="${esc(n)}">${square(ic,'blue')}<strong>${n}</strong><small>${s}</small><span>${m}${icon('arrow-right','xs')}</span></button>`).join('')}</div>${pNote('Collections and counts are examples, not entries from your knowledge index.')}`;
 if(tab==='Ingestion')main=`${pCard('Import knowledge',`<div class="p-dropzone">${icon('upload','lg')}<strong>Add documents to your knowledge library</strong><span>Supported formats, quotas and indexing are checked by the real backend.</span>${pAct('Choose file','Knowledge upload',true,'plus')}</div><div class="p-steps-list">${['Uploaded','Parsing','Indexed and searchable'].map((x,i)=>`<span><b>${i+1}</b>${x}</span>`).join('')}</div>`, 'p-tight')}${pStack('Ingestion history',[['No real ingestion runs','Connect the indexing pipeline to show upload status','workflow','Unavailable']])}`;
 if(tab==='Retrieval details')main=`${pCard('Retrieval trace',`<div class="p-visual-flow">${pFlow(['Question','Retrieve','Rank','Cite'])}</div><p class="muted">A real answer should link its evidence to the source document, section and access policy.</p>`, 'p-tight')}${pStack('Trace information',[['Source permissions','Preserve access checks at retrieval time','shield'],['Citations and provenance','Show original files with stable source links','book-open'],['Index versions','Make indexing and retrieval failures visible','layers']])}`;
 return [main,pRail('Knowledge overview',pStack('Working with sources',[['Search quality','Ranked retrieval when available','search'],['Source access','Respect project-level permissions','shield'],['Index health','Use the real ingestion status','workflow']]),pNote('Results, citations and collection counts are UI examples.'))];}
function pVoice(tab){let main='';if(tab==='Recordings')main=`<div class="p-voice-hero"><div class="p-record-circle">${icon('mic','xl')}</div>${pEyebrow('Voice workspace')}<h2>Your ideas, captured clearly.</h2><p>Start a recording, then review an accurate transcript before using it in a conversation.</p><div class="p-wave" aria-hidden="true">${Array.from({length:47},(_,i)=>`<span style="--wave-height:${15+(i*19+i*i*3)%66}px;--wave-delay:${(i%11)*-0.08}s"></span>`).join('')}</div><div class="row" style="justify-content:center">${pAct('Start recording','Request microphone permission',true,'mic')}${pAct('Choose audio file','Upload voice recording',false,'upload')}</div><small class="p-subtext">Waveform is a visual animation, not live microphone input.</small></div>${pCard('Saved sessions',pEmpty('mic','No connected recordings','Recorded sessions appear here once the voice service is connected.','Review voice integration'), 'p-tight')}`;

function demoAfterRender(){document.querySelectorAll('form[data-form-action="demoSettings"]').forEach(form=>{const values=demoSettingsDB[form.getAttribute('data-scope')||state.route]||{};Object.entries(values).forEach(([key,val])=>{if(form.elements.namedItem(key))form.elements.namedItem(key).value=val})})}
function demoToast(m,kind='success'){toast(m,kind)}
function demoSplit(v){const [route,kind,id]=String(v||'').split('|');return [route||state.route,kind||demoCollection(),id||'']}
function demoMakeId(kind){return kind.slice(0,2)+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function demoSaveEditor(form){const route=form.getAttribute('data-route'),kind=form.getAttribute('data-kind'),id=form.getAttribute('data-id');let record=id?(demoDB[route]?.[kind]||[]).find(x=>x.id===id):null;const fields=Object.fromEntries(new FormData(form));const name=String(fields.name||'').trim();if(!name){demoToast('Enter a name.','error');return}
 if(record)Object.assign(record,fields);else{record={id:demoMakeId(kind),...fields,status:fields.status|| (kind==='messages'?'Draft':kind==='secrets'?'Active':'Ready')};demoDB[route][kind].unshift(record)}
 demoLog(`${id?'Updated':'Created'} ${record.name}`,route);closeOverlay();render();demoToast(`${record.name} ${id?'updated':'created'} in local demo.`)}
function demoDeleteConfirm(route,kind,id){const row=(demoDB[route]?.[kind]||[]).find(x=>x.id===id);if(!row)return;overlay(`<div class="modal" role="dialog" aria-modal="true"><h2>Delete “${esc(row.name)}”?</h2><p>This deletes the local demo record. It does not affect your backend.</p><div class="modal-actions">${button('Cancel','closeOverlay')}${demoActionBtn('Delete record','demoDeleteYes',route+'|'+kind+'|'+id,'danger','x')}</div></div>`)}
function demoDownload(name,body,mime='application/json'){const blob=new Blob([body],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function demoTranscript(){overlay(`<div class="modal demo-large-modal" role="dialog" aria-modal="true"><div class="row between"><h2>Edit demo transcript</h2>${iconbtn('x','closeOverlay','Close')}</div><p>Edit the transcript text and save a local example.</p><form data-form-action="demoTranscriptSave"><textarea name="transcript" class="textarea" rows="8" required>We should make this workflow easy to understand from the first click. The agent timeline needs to show real status, not just a spinner.</textarea><div class="modal-actions">${button('Cancel','closeOverlay')}<button class="btn primary" type="submit">Save transcript</button></div></form></div>`)}
function demoCompose(reply=''){overlay(`<div class="modal demo-large-modal" role="dialog" aria-modal="true"><div class="row between"><h2>${reply?'Reply':'Compose message'}</h2>${iconbtn('x','closeOverlay','Close')}</div><p>Use demo@example.org addresses only. No email will actually be sent.</p><form data-form-action="demoComposeSave"><label class="demo-form-field"><span>To</span><input type="email" name="recipient" class="input" required value="${esc(reply||'team@demo.example')}"></label><label class="demo-form-field"><span>Subject</span><input name="subject" class="input" required placeholder="Message subject"></label><label class="demo-form-field"><span>Message</span><textarea name="message" class="textarea" rows="6" required placeholder="Write your message…"></textarea></label><div class="modal-actions">${button('Cancel','closeOverlay')}<button class="btn" type="submit" name="sendMode" value="draft">Save draft</button><button class="btn primary" type="submit" name="sendMode" value="send">Send in demo</button></div></form></div>`)}
function demoRun(route,kind,id,name=''){if(demoActiveJob&&demoActiveJob.status!=='Completed'){demoToast('Finish or cancel the current simulated task first.','error');return}const target=(demoDB[route]?.[kind]||[]).find(x=>x.id===id);const title=name||target?.name||id||'Demo operation';const job={id:demoMakeId('job'),route,kind,recordId:id,name:title,status:'Queued',step:0,started:Date.now()};demoActiveJob=job;livingMirrorJob(job);traceMirrorJob(job);if(target){target.status='Running';demoPersist()}demoLog(`Started ${title}`,route,'Running');if(route==='automations'){F.runs.unshift({status:'running',time:'Now',info:`${title} · queued`,duration:'Running'});corePersist()}render();demoRenderHUD();livingAfterRender();const stages=['Preparing example inputs','Validating configuration','Processing example records','Generating sample output','Completed'];let step=0;job.timer=setInterval(()=>{if(demoActiveJob!==job){clearInterval(job.timer);return}step++;job.step=step;job.status=step>=stages.length-1?'Completed':'Running';job.message=stages[Math.min(step,stages.length-1)];if(step>=stages.length-1){clearInterval(job.timer);if(target){target.status='Completed';target.duration='4s';if(route==='scraper'){target.count=7;demoDB.scraper.results.unshift({id:demoMakeId('result'),name:target.name+' · extracted JSON',description:'7 pages · 21 fields (simulated)',status:'Available',count:21})}if(route==='finetune'){target.loss='0.39';demoDB.finetune.checkpoints.unshift({id:demoMakeId('check'),name:target.name+' checkpoint',description:'Simulated LoRA adapter weights',status:'Ready',size:'80 MB'})}if(route==='science'){target.accuracy='90.8%';demoDB.science.reports.unshift({id:demoMakeId('report'),name:target.name+' report',description:'Example metrics and method summary',status:'Draft'})}}demoLog(`Completed ${title}`,route,'Completed');if(route==='automations'&&F.runs[0]?.status==='running'){F.runs[0].status='success';F.runs[0].info=`${title} · sample output generated`;F.runs[0].duration='4s';corePersist()}demoPersist();render();setTimeout(()=>{if(demoActiveJob===job){demoActiveJob=null;el('demo-job-hud')?.remove()}},4200)}else{if(target)demoPersist()}demoRenderHUD();livingUpdateJob(job);traceUpdateJob(job);const current=el('content');if(current&&state.route===route&&step===stages.length-1)current.scrollTop=0},1000)}
function demoRenderHUD(){const job=demoActiveJob;if(!job)return;let node=el('demo-job-hud');if(!node){node=document.createElement('div');node.id='demo-job-hud';document.body.append(node)}const progress=Math.round(job.step/4*100);node.innerHTML=`<div class="row between"><div class="row">${square('workflow','blue','sm')}<div><strong>${esc(job.name)}</strong><small>Simulated ${esc(job.route)} operation</small></div></div><button class="icon-button" data-action="demoCancelRun" title="Close or cancel">${icon('x')}</button></div><div class="row" style="margin:13px 0">${badge(job.status,job.status==='Completed'?'green':'blue')}<span class="caption">${esc(job.message||'Queued')}</span></div><div class="progress"><span style="width:${progress}%"></span></div><div class="demo-job-stages">${['Prepare','Validate','Process','Finish'].map((x,i)=>`<span class="${job.step>i?'complete':''}">${job.step>i?'✓ ':''}${x}</span>`).join('')}</div><p class="caption" style="margin-top:10px">Illustrative timing and results; no backend task is running.</p>`;
}
function demoHandleAction(action,arg,source){const route=state.route;let r,k,id;
 switch(action){
 case'demoCreate':demoEditor(route,arg||demoCollection());return true;
 case'demoDetails':[r,k,id]=demoSplit(arg);demoInfo(r,k,id);return true;
 case'demoEdit':[r,k,id]=demoSplit(arg);demoEditor(r,k,id);return true;
 case'demoMenu':[r,k,id]=demoSplit(arg);demoMore(r,k,id);return true;
 case'demoDelete':[r,k,id]=demoSplit(arg);demoDeleteConfirm(r,k,id);return true;
 case'demoDeleteYes':[r,k,id]=demoSplit(arg);demoDB[r][k]=demoDB[r][k].filter(x=>x.id!==id);demoLog(`Deleted example ${k} record`,r);closeOverlay();render();demoToast('Demo record deleted.');return true;
 case'demoClone':[r,k,id]=demoSplit(arg);{const old=demoDB[r][k].find(x=>x.id===id);if(old)demoDB[r][k].unshift({...old,id:demoMakeId(k),name:old.name+' (copy)'});demoLog(`Duplicated ${old?.name}`,r);closeOverlay();render();demoToast('Duplicated sample item.');return true}
 case'demoRun':[r,k,id]=demoSplit(arg);closeOverlay();demoRun(r,k,id);return true;
 case'demoSetStatus':{const bits=String(arg).split('|');const [r,k,id]=bits;const target=demoDB[r]?.[k]?.find(x=>x.id===id);if(target){target.status=bits.slice(3).join('|');demoLog(`${target.name} · ${target.status}`,r);demoPersist();closeOverlay();render();demoToast(`Status set to ${target.status}.`)}return true}
 case'demoRotate':{const [r,k,id]=demoSplit(arg);const target=demoDB[r]?.[k]?.find(x=>x.id===id);if(target){target.updated='Just now';demoLog(`Rotated synthetic reference: ${target.name}`,r);closeOverlay();render();demoToast('Example key rotation recorded. No secret generated.')}return true}

 clearInterval(living.timer);living.timer=null;

 const run={id:'demo-'+Date.now().toString(36),route,title:title||`${route[0].toUpperCase()+route.slice(1)} activity`,status:config.recording?'Recording':'Running',started:Date.now(),current:0,steps:[...steps],events:[],summary:'',saved:false,managed:!!config.managed,recording:!!config.recording};

 const bar=host.querySelector('.trace-progress');
 if(bar){bar.setAttribute('aria-valuenow',String(Math.round(run.progress)));const fill=bar.querySelector('span');if(fill)fill.style.width=run.progress+'%'}
 const percent=host.querySelector('.trace-run-percent');if(percent)percent.textContent=Math.round(run.progress)+'%';
 const mini=host.querySelector('.trace-mini-actions>span');if(mini)mini.textContent=Math.round(run.progress)+'% · '+run.status;
 const download=host.querySelector('.trace-download-track i');if(download)download.style.width=run.progress+'%';
 const footer=host.querySelector('.trace-visual-download .trace-visual-foot');if(footer)footer.textContent=(4.4*run.progress/100).toFixed(2)+' / 4.4 GB · Simulated transfer';
}
function traceStart(route){const scene=TRACE_SCENES[route];if(!scene)return;const run=traceGet(route);traceStopTimer(run);run.status='Running';run.step=0;run.progress=0;run.duration=0;run.created=Date.now();run.events=[];traceLog(run,'Sample session started · no backend services contacted','info');traceUI.expanded[route]=true;traceUI.selected[route]=0;traceSave();traceRefresh(route);
 run.timer=setInterval(()=>{if(run.status!=='Running')return;run.duration+=0.15;run.progress=Math.min(100,run.progress+2.1);const index=Math.min(scene.steps.length-1,Math.floor(run.progress/25));
 if(index!==run.step){run.step=index;traceUI.selected[route]=index;traceLog(run,`${scene.steps[index].agent}: ${scene.steps[index].name}`,'info');traceRefresh(route)}
 else traceUpdateProgress(route,run);
 if(run.progress>=100){run.status='Completed';run.step=scene.steps.length;traceLog(run,scene.output,'success');traceStopTimer(run);traceRefresh(route)}
 },150);
}
function tracePause(route){const run=traceGet(route);if(!run)return;if(run.status==='Running'){run.status='Paused';traceLog(run,'Example playback paused')}else if(run.status==='Paused'){run.status='Running';traceLog(run,'Example playback resumed')}traceRefresh(route)}
function traceCancel(route){const run=traceGet(route);if(!run)return;traceStopTimer(run);run.status='Cancelled';traceLog(run,'Example cancelled locally','warning');traceRefresh(route)}
function traceSave(){save('trace-expanded-v2',traceUI.expanded)}
const tracePhase=(run,i)=>run.status==='Preview'?(i===0?'complete':i===1?'preview':'pending'):(run.status==='Completed'?'complete':i<run.step?'complete':i===run.step&&(run.status==='Running'||run.status==='Paused')?'active':'pending');
const traceIcon=(name)=>icon(name,'sm');
function traceSpark(route){const x=[32,38,35,49,48,43,57,52,50,65,59,71,66,73,69,83,80,88,82,94],shift=TRACE_ROUTES.indexOf(route)%4*5;const points=x.map((v,i)=>`${i*14},${101-v+shift}`).join(' ');return `<svg class="trace-chart" viewBox="0 0 266 100" preserveAspectRatio="none" aria-label="Illustrative metric trend"><defs><linearGradient id="trace-area-${route}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#39a9ff" stop-opacity=".22"/><stop offset="1" stop-color="#39a9ff" stop-opacity="0"/></linearGradient></defs><polygon points="0,100 ${points} 266,100" fill="url(#trace-area-${route})"/><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function traceButton(route,action,label,cls=''){return `<button type="button" class="trace-btn ${cls}" data-action="${action}" data-value="${route}">${label}</button>`}
function traceWave(route){return `<div class="trace-voice-wave" aria-label="Decorative audio waveform, no microphone input">${Array.from({length:40},(_,i)=>`<i style="--peak:${10+(i*13%48)}px;--delay:${(i%9)*-.17}s"></i>`).join('')}</div>`}
function traceDetailMarkup(route,i,run){const sc=TRACE_SCENES[route],step=sc.steps[i],phase=tracePhase(run,i);return `<div class="trace-step-extra"><p>${traceSafe(step.detail)}</p><div class="trace-tool"><span>${traceIcon('terminal')} Tool</span><code>${traceSafe(step.tool)}</code></div><div class="trace-step-output">${traceIcon(phase==='complete'?'check-circle':'info')} ${traceSafe(phase==='complete'?step.out:'Illustrative operation · select Play to advance')}</div></div>`}
function traceStepMarkup(route,run,i){const scene=TRACE_SCENES[route],step=scene.steps[i],phase=tracePhase(run,i),selected=traceUI.selected[route]===i;return `<div class="trace-step trace-step-${phase} ${selected?'trace-selected':''}" data-phase="${phase}"><div class="trace-connector"><span class="trace-step-node">${phase==='complete'?traceIcon('check'):phase==='active'?'<i class="trace-node-core"></i>':i+1}</span></div><div class="trace-step-body"><button type="button" class="trace-step-head" data-action="traceSelect" data-value="${route}:${i}" aria-expanded="${selected}"><span class="trace-step-title">${traceSafe(i+1+'. '+step.name)}<small>${traceSafe(step.agent)}</small></span><span class="trace-status trace-status-${phase}">${phase==='active'?(run.status==='Paused'?'Paused':'Running'):phase==='complete'?'Completed':phase==='preview'?'Preview':'Pending'}</span>${traceIcon(selected?'chevron-up':'chevron-down')}</button>${selected?traceDetailMarkup(route,i,run):''}</div></div>`}
function traceMetrics(route,run){const scene=TRACE_SCENES[route];return `<div class="trace-metric-grid">${scene.metrics.map(([label,value])=>`<div><small>${traceSafe(label)}</small><strong>${traceSafe(value)}</strong></div>`).join('')}</div>`}
function traceLogMarkup(route,run){return `<section class="trace-log-panel"><div class="trace-rail-heading">${traceIcon('terminal')} <strong>Execution log</strong><span class="trace-demo-indicator">LOCAL EXAMPLE</span></div><div class="trace-log-stream">${run.events.slice(-6).map(ev=>`<p><time>${traceSafe(ev.time)}</time> ${traceSafe(ev.message)}</p>`).join('')}</div></section>`}
function traceVisualization(route,run){const scene=TRACE_SCENES[route];return route==='voice'?`<div class="trace-visual trace-visual-audio"><div class="trace-visual-top">${traceIcon('mic')} Live waveform preview <span>SIMULATED</span></div>${traceWave(route)}<div class="trace-visual-foot">${traceIcon('audio-lines')} Synthetic amplitude · ${run.status==='Running'?'Capturing preview':'No live microphone input'}</div></div>`:route==='models'?`<div class="trace-visual trace-visual-download"><div class="trace-visual-top">${traceIcon('hard-drive-download')} Model transfer <span>SIMULATED</span></div><div class="trace-file-row"><div class="trace-model-art">7B</div><div><strong>openagent-7b-instruct.gguf</strong><small>4.4 GB · quantised model · sample</small></div></div><div class="trace-download-track"><i style="width:${Math.round(run.progress)}%"></i></div><div class="trace-visual-foot">${(4.4*run.progress/100).toFixed(2)} / 4.4 GB · ${run.status==='Running'?'Animating file transfer':'No download performed'}</div></div>`:route==='finetune'?`<div class="trace-visual trace-visual-training"><div class="trace-visual-top">${traceIcon('line-chart')} Training telemetry <span>SIMULATED</span></div>${traceSpark(route)}<div class="trace-training-markers"><span>Epoch ${Math.min(3,Math.ceil(run.progress/34)||1)} / 3</span><span>Loss 0.42 (fixture)</span></div></div>`:route==='codeq'?`<div class="trace-visual trace-code-box"><div class="trace-visual-top">${traceIcon('git-pull-request')} Proposed change <span>NO WRITE</span></div><pre><span class="trace-dim">src/components/ProductCard.tsx</span>\n<span class="trace-deleted">- const label = 'Buy now';</span>\n<span class="trace-added">+ const label = 'Add to basket';</span>\n<span class="trace-added">+ ariaLabel: product.name;</span></pre></div>`:route==='scraper'?`<div class="trace-visual"><div class="trace-visual-top">${traceIcon('table-2')} Extraction preview <span>SIMULATED</span></div><div class="trace-table"><span>Title</span><span>Price</span><span>Available</span><strong>Sample item A</strong><strong>£29.00</strong><strong>Yes</strong><strong>Sample item B</strong><strong>£41.00</strong><strong>No</strong></div></div>`:route==='science'?`<div class="trace-visual"><div class="trace-visual-top">${traceIcon('flask-conical')} Experiment metrics <span>SAMPLE</span></div>${traceSpark(route)}<div class="trace-training-markers"><span>Trial A · 0.81</span><span>Trial B · 0.84</span></div></div>`:route==='research'?`<div class="trace-visual trace-research-view"><div class="trace-visual-top">${traceIcon('library-big')} Evidence graph <span>ILLUSTRATIVE</span></div><div class="trace-source-pills"><span>Question</span><b>→</b><span>5 sample sources</span><b>→</b><span>Draft report</span></div>${traceSpark(route)}</div>`:route==='automations'?`<div class="trace-visual"><div class="trace-visual-top">${traceIcon('calendar-days')} Schedule preview <span>DRY RUN</span></div><div class="trace-schedule-row"><div>08:00<small>Example trigger</small></div><span>→</span><div>Collect<small>4 items</small></div><span>→</span><div>Review<small>No delivery</small></div></div></div>`:route==='chat'?`<div class="trace-visual"><div class="trace-visual-top">${traceIcon('sparkles')} Tool-use context <span>DEMO</span></div><div class="trace-chat-context"><p>${traceIcon('search')} Local knowledge lookup <em>3 examples</em></p><p>${traceIcon('file-text')} Conversation memory <em>Sample only</em></p></div></div>`:`<div class="trace-visual"><div class="trace-visual-top">${traceIcon('activity')} Sample activity metrics <span>ILLUSTRATIVE</span></div>${traceSpark(route)}<div class="trace-training-markers"><span>3 agent roles</span><span>4 stages</span></div></div>`}
function traceMarkup(route){const scene=TRACE_SCENES[route],run=traceGet(route),expanded=traceUI.expanded[route]!==false,mini=scene.layout==='code'||scene.layout==='compact';let controls=`${traceButton(route,'traceStart',traceIcon('play')+' '+(run.status==='Completed'?'Replay example':'Play example'),'primary')}${run.status==='Running'||run.status==='Paused'?traceButton(route,'tracePause',traceIcon(run.status==='Paused'?'play':'pause')+' '+(run.status==='Paused'?'Resume':'Pause')):''}${run.status==='Running'||run.status==='Paused'?traceButton(route,'traceCancel',traceIcon('square')+' Stop'):''}${traceButton(route,'traceDetails',traceIcon('maximize-2')+' Details')}`;
 return `<section class="trace-mount trace-${route} trace-layout-${scene.layout} ${traceRunning(run)?"trace-is-running":""}" data-trace-route="${route}" aria-label="${traceSafe(scene.title)}"><div class="trace-shell"><header class="trace-head"><div class="trace-head-left"><span class="trace-head-icon">${traceIcon(scene.glyph)}</span><div><div class="trace-title-line"><strong>${traceSafe(scene.title)}</strong><span class="trace-head-state ${traceRunning(run)?'trace-state-live':''}">${traceSafe(run.status==='Preview'?'Interactive preview':run.status)}</span></div><p>${traceSafe(scene.subtitle)} <span class="trace-example-mark">· DEMO DATA</span></p></div></div><div class="trace-head-actions">${traceButton(route,'traceToggle',traceIcon(expanded?'chevron-up':'chevron-down')+' '+(expanded?'Collapse':'Expand'))}</div></header>${expanded?`<div class="trace-layout"><div class="trace-main"><div class="trace-run-row"><div><span class="trace-run-kicker">${traceRunning(run)?'<span class="trace-live-pulse"></span> PLAYING LOCAL EXAMPLE':'EXECUTION PREVIEW'}</span><p class="trace-run-sub">${traceSafe(run.status==='Completed'?scene.output:run.status==='Cancelled'?'Simulation stopped; no external operation occurred.':run.status==='Preview'?'Explore the full workflow below, or play the synthetic run.':`Stage ${Math.min(run.step+1,scene.steps.length)} of ${scene.steps.length} · ${scene.steps[Math.min(run.step,scene.steps.length-1)].name}`)}</p></div><span class="trace-run-percent">${Math.round(run.progress)}%</span></div><div class="trace-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(run.progress)}" aria-label="Simulated activity progress"><span style="width:${run.progress}%"></span></div><div class="trace-steps">${scene.steps.map((_,i)=>traceStepMarkup(route,run,i)).join('')}</div><div class="trace-controls">${controls}</div>${run.status==='Completed'?`<div class="trace-result">${traceIcon('check-circle-2')}<span>${traceSafe(scene.output)}</span></div>`:''}</div><aside class="trace-rail">${traceVisualization(route,run)}<div class="trace-metric-card"><div class="trace-rail-heading">${traceIcon('gauge')} <strong>${route==='models'?'Model details':route==='voice'?'Capture status':route==='finetune'?'Training summary':'Sample metrics'}</strong></div>${traceMetrics(route,run)}</div>${traceLogMarkup(route,run)}</aside></div>`:`<div class="trace-collapsed"><div class="trace-mini-steps">${scene.steps.map((s,i)=>`<span class="trace-mini-stage ${tracePhase(run,i)}" title="${traceSafe(s.name)}"><i></i><em>${traceSafe(s.name)}</em></span>`).join('')}</div><div class="trace-mini-actions"><span>${Math.round(run.progress)}% · ${traceSafe(run.status)}</span>${traceButton(route,'traceStart',traceIcon('play')+' Play example','primary')}</div></div>`}<footer class="trace-foot"><span>${traceIcon('shield-check')} Sample UI states only · no API calls, model downloads, execution, audio capture, network requests or file writes</span>${traceButton(route,'traceExport',traceIcon('download')+' Export example')}</footer></div></section>`
}
function traceMount(){const route=state.route,scene=TRACE_SCENES[route];if(!scene)return;const area=el('content');if(!area)return;let anchor=null,where='beforebegin';
 switch(route){
 case'agents':anchor=area.querySelector('.agent-board,.agent-directory');where='beforebegin';break;
 case'chat':anchor=area.querySelector('.chat-composer-outer');where='beforebegin';break;
 case'research':anchor=area.querySelector('.research-article .tabs');where='beforebegin';break;
 case'codeq':anchor=area.querySelector('.codeq-assistant-body,.codeq-bottom,.codeq-center');where=anchor?.classList.contains('codeq-assistant-body')?'afterbegin':'beforebegin';break;
 case'models':anchor=area.querySelector('.models-shell');where='beforebegin';break;
 case'automations':anchor=area.querySelector('.automation-detail .tabs,.automation-detail .metric-strip');where='afterend';break;
 case'voice':anchor=area.querySelector('.p-voice-hero');where='afterend';break;
 default:anchor=area.querySelector('.p-primary');where='afterbegin';break;
 }
 if(!anchor)return;
 const existing=area.querySelector('.trace-mount');if(existing){if(existing.dataset.traceRoute!==route)existing.remove();else return traceRefresh(route)}
 anchor.insertAdjacentHTML(where,traceMarkup(route));
}
function traceRefresh(route){if(state.route!==route)return;const old=document.querySelector(`.trace-mount[data-trace-route="${route}"]`);if(!old)return;const active=document.activeElement;const focused=active&&old.contains(active)?{action:active.dataset.action,value:active.dataset.value}:null;old.outerHTML=traceMarkup(route);if(focused){const buttons=Array.from(document.querySelectorAll(`.trace-mount[data-trace-route="${route}"] [data-action="${focused.action}"]`));buttons.find(b=>b.dataset.value===focused.value)?.focus({preventScroll:true})}}
function traceDetails(route){const sc=TRACE_SCENES[route],run=traceGet(route);if(!sc)return;overlay(`<div class="modal trace-detail-modal" role="dialog" aria-modal="true" aria-labelledby="trace-detail-title"><div class="row between"><div><div class="trace-run-kicker">LOCAL WORKFLOW SIMULATION</div><h2 id="trace-detail-title">${traceSafe(sc.title)}</h2><p>${traceSafe(sc.subtitle)}</p></div>${iconbtn('x','closeOverlay','Close')}</div><div class="trace-detail-meta">${traceMetrics(route,run)}<p>${traceSafe(sc.output)}</p></div><h3>Full execution trace</h3>${sc.steps.map((step,i)=>`<div class="trace-detail-step"><span class="trace-status trace-status-${tracePhase(run,i)}">${i+1}</span><div><strong>${traceSafe(step.name)}</strong><p>${traceSafe(step.detail)}</p><code>${traceSafe(step.tool)}</code><small>${traceSafe(step.out)}</small></div></div>`).join('')}<h3>Local event history</h3><div class="trace-detail-logs">${run.events.map(e=>`<p>${traceSafe(e.time)} · ${traceSafe(e.message)}</p>`).join('')}</div><div class="row between" style="margin-top:17px"><small class="muted">No real service actions performed.</small><button class="btn" data-action="closeOverlay">Close</button></div></div>`)}
function traceExport(route){const run=traceGet(route),scene=TRACE_SCENES[route];demoDownload(`openagent-${route}-sample-trace.json`,JSON.stringify({notice:'LOCAL SYNTHETIC DATA ONLY. No backend run occurred.',route,status:run.status,progress:run.progress,steps:traceDataset(route),sampleMetrics:scene.metrics,events:run.events,output:scene.output},null,2))}
function traceHandleAction(action,arg){switch(action){case'traceStart':traceStart(arg);return true;case'tracePause':tracePause(arg);return true;case'traceCancel':traceCancel(arg);return true;case'traceToggle':traceUI.expanded[arg]=traceUI.expanded[arg]===false;traceSave();traceRefresh(arg);return true;case'traceSelect':{const last=arg.lastIndexOf(':'),r=arg.slice(0,last),i=+arg.slice(last+1);traceUI.selected[r]=traceUI.selected[r]===i?-1:i;traceRefresh(r);return true}case'traceDetails':traceDetails(arg);return true;case'traceExport':traceExport(arg);return true;default:return false}}
/* Existing demo workflow bridge. Real backend adapters should replace this
   intentionally small boundary, not change timeline components. */
function traceMirrorJob(job){if(!TRACE_SCENES[job.route])return;const run=traceGet(job.route);traceStopTimer(run);run.status='Running';run.step=0;run.progress=0;run.events=[];run.duration=0;traceLog(run,`${job.name} started in the sample job engine`);traceRefresh(job.route)}
function traceUpdateJob(job){if(!TRACE_SCENES[job.route])return;const run=traceGet(job.route);traceStopTimer(run);run.step=Math.min(4,Math.max(0,job.step));traceUI.selected[job.route]=Math.min(3,run.step);run.progress=Math.round(run.step/4*100);run.status=job.status==='Completed'?'Completed':job.status==='Cancelled'?'Cancelled':'Running';traceLog(run,job.message||`Example stage ${run.step} updated`,job.status==='Completed'?'success':'info');traceRefresh(job.route)}
function traceVoiceBegin(){const run=traceGet('voice');traceStopTimer(run);run.status='Recording';run.step=0;run.progress=20;traceLog(run,'Synthetic microphone preview active · no audio hardware used');traceRefresh('voice')}
function traceVoiceFinish(){const run=traceGet('voice');traceStopTimer(run);run.step=4;run.progress=100;run.status='Completed';traceLog(run,'Synthetic transcript saved locally','success');traceRefresh('voice')}
function traceChatStream(percent){const run=traceGet('chat');traceStopTimer(run);if(run.status!=='Running'&&percent<100){run.status='Running';run.events=[];traceLog(run,'Scripted example response started')}run.progress=Math.min(100,Math.round(percent));run.step=Math.min(3,Math.floor(run.progress/25));if(run.progress>=100){run.status='Completed';run.step=4;traceLog(run,'Scripted local response finished','success')}traceRefresh('chat')}

if(!VALID.has(state.route))state.route='home';if(!state.modelsTab)state.modelsTab='All models';
render();
})();
</script></body></html>
