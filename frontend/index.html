<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="description" content="OpenAgent local AI workbench" />
    <title>OpenAgent</title>
    <script>
      try { const preference = localStorage.getItem('openagent.ui.v2.theme') || 'system'; const dark = preference === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : preference === 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; } catch {}
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
