name: Opt-in engine whole-model evidence
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        required: true
        options: [linux, cuda, hip, metal]
      decoder:
        type: choice
        required: true
        options: [mixtral, qwen35, qwen4, glm-dsa, glm5-next, inkling, kimi-k3, deepseek-v41]
      decoder_manifest:
        description: Absolute pinned comparison manifest on the selected runner
        type: string
        required: true
      device:
        description: Explicit device index
        type: string
        default: '0'
      python:
        description: Python executable in the preinstalled pinned backend environment
        type: string
        default: python
permissions:
  contents: read
concurrency:
  group: engine-whole-model-${{ inputs.backend }}-${{ inputs.device }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ${{ fromJSON(inputs.backend == 'metal' && '["self-hosted", "macOS", "engine-metal"]' || inputs.backend == 'cuda' && '["self-hosted", "Linux", "engine-cuda"]' || inputs.backend == 'hip' && '["self-hosted", "Linux", "engine-hip"]' || '["self-hosted", "Linux", "engine-liburing"]') }}
    timeout-minutes: 180
    env:
      OA_BACKEND: ${{ inputs.backend }}
      OA_DECODER: ${{ inputs.decoder }}
      OA_MANIFEST: ${{ inputs.decoder_manifest }}
      OA_DEVICE: ${{ inputs.device }}
      OA_PYTHON: ${{ inputs.python }}
      OA_EVIDENCE: ${{ runner.temp }}/openagent-evidence-${{ github.run_id }}
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Run explicit pinned decoder comparison
        shell: bash
        run: |
          "$OA_PYTHON" -m openagent.adaptive_engine.platform_certification \
            --backend "$OA_BACKEND" --scope full-model \
            --decoder "$OA_DECODER" --decoder-manifest "$OA_MANIFEST" \
            --device "$OA_DEVICE" --timeout 3600 \
            --report "$OA_EVIDENCE/report.json"
      - name: Preserve complete comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-model-${{ inputs.backend }}-${{ inputs.decoder }}-${{ github.run_id }}
          path: ${{ env.OA_EVIDENCE }}
          if-no-files-found: error
