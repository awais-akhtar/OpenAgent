name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify bundled frontend matches its source
        run: |
          npm ci
          npm run check:web
          npm run build:web
          git diff --exit-code -- web/app.js

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Install release verification dependencies
        run: python -m pip install -e ".[full]" build twine

      - name: Run the test suite
        run: python -m unittest discover -s tests

      - name: Build distribution artifacts
        run: |
          python -m build
          twine check dist/*
          sha256sum dist/* > SHA256SUMS

      - name: Store verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openagent/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Verify downloaded artifact checksums
        run: sha256sum --check SHA256SUMS

      - name: Attest the exact distributions being published
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
