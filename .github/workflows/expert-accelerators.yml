name: Expert accelerator certification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hardware runner to verify
        type: choice
        required: true
        default: all
        options: [all, cuda, hip, metal]

permissions:
  contents: read

jobs:
  cuda:
    if: inputs.platform == 'all' || inputs.platform == 'cuda'
    runs-on: [self-hosted, linux, x64, openagent-cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check strict runner contracts
        run: python -m unittest tests.test_platform_certification_runner -v
      - name: Verify CUDA runtime and expert execution
        env:
          OPENAGENT_CUDA_HIP_CERTIFY: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -c "import torch; assert torch.version.cuda and not torch.version.hip, 'CUDA runner requires a CUDA PyTorch build'"
          python -m tests.test_cuda_hip_certification
  hip:
    if: inputs.platform == 'all' || inputs.platform == 'hip'
    runs-on: [self-hosted, linux, x64, openagent-hip]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check strict runner contracts
        run: python -m unittest tests.test_platform_certification_runner -v
      - name: Verify HIP runtime and expert execution
        env:
          OPENAGENT_CUDA_HIP_CERTIFY: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -c "import torch; assert torch.version.hip, 'HIP runner requires a ROCm PyTorch build'"
          python -m tests.test_cuda_hip_certification
  metal:
    if: inputs.platform == 'all' || inputs.platform == 'metal'
    runs-on: [self-hosted, macOS, ARM64, openagent-metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check strict runner contracts
        run: python3 -m unittest tests.test_platform_certification_runner -v
      - name: Verify Metal runtime and expert execution
        env:
          OPENAGENT_CERTIFY_METAL: '1'
          PYTORCH_ENABLE_MPS_FALLBACK: '0'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python3 -m tests.test_metal_certification
