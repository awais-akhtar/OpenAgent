name: Engine platform certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: linux
            labels: '["self-hosted", "Linux", "engine-liburing"]'
          - backend: cuda
            labels: '["self-hosted", "Linux", "engine-cuda"]'
          - backend: hip
            labels: '["self-hosted", "Linux", "engine-hip"]'
          - backend: metal
            labels: '["self-hosted", "macOS", "engine-metal"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and certify on actual host
        run: python -m openagent.adaptive_engine.platform_certification --backend ${{ matrix.backend }} --report certification/${{ matrix.backend }}.json
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-certification-${{ matrix.backend }}-${{ github.run_id }}
          path: certification/
          if-no-files-found: error
