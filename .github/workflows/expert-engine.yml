name: Expert engine validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'openagent/adaptive_engine/**'
      - 'tests/test_*expert*.py'
      - 'tests/test_olmoe*.py'
      - 'tests/test_hf_moe*.py'
      - 'tests/test_uring_io.py'
      - 'tests/test_linux_engine_certification.py'
      - 'docs/ENGINE_LINUX_VALIDATION.md'
      - 'tests/test_cpu_threads.py'
      - 'tests/test_segment_snapshot.py'
      - 'tests/test_native_*.py'
      - 'tests/test_q4_*.py'
      - 'tests/test_q8_*.py'
      - 'tests/test_q5_*.py'
      - 'tests/test_family_conformance.py'
      - 'tests/test_engine_source_packaging.py'
      - 'tests/test_engine_public_surface.py'
      - 'tests/test_independent_*.py'
      - 'tests/test_lowbit_expert.py'
      - 'tests/test_extended_packed_olmoe.py'
      - 'tests/test_mxfp4_integration.py'
      - 'tests/test_grouped_int4_expert.py'
      - 'tests/prepare_kimi_oracle.py'
      - 'tests/test_prepare_kimi_oracle.py'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - '.github/workflows/expert-engine.yml'

permissions:
  contents: read

jobs:
  linux-experts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native I/O dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev build-essential
      - name: Install reference runtimes
        run: python -m pip install -e '.[engine-native,engine-hf-moe]'
      - name: Require a working io_uring kernel
        run: |
          python - <<'PY'
          from openagent.adaptive_engine.uring_io import capability_report
          report = capability_report()
          print(report)
          assert report['available'], report['reason']
          PY
      - name: Test native storage and model semantics
        env:
          OPENAGENT_REQUIRE_URING: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TMPDIR: ${{ runner.temp }}
          XDG_CACHE_HOME: ${{ runner.temp }}/openagent-cache
        run: |
          set -euo pipefail
          python -m tests.test_linux_engine_certification \
            tests.test_linux_engine_certification.CertificationRunnerTests \
            tests.test_uring_io tests.test_expert_io tests.test_expert_store \
            tests.test_native_expert tests.test_expert_kernels tests.test_sparse_expert_runtime \
            tests.test_olmoe_batch tests.test_olmoe_continuous tests.test_olmoe_serve \
            tests.test_hf_moe tests.test_olmoe_validation tests.test_olmoe_transformers_reference \
            tests.test_cpu_threads tests.test_olmoe_autotune tests.test_vectorized_expert \
            tests.test_olmoe_segments tests.test_segment_snapshot tests.test_expert_cli_kernels \
            tests.test_checkpoint_recovery
          python -m tests.test_linux_engine_certification \
            tests.test_packed_expert tests.test_packed_expert_integration \
            tests.test_native_packed_expert tests.test_segment_abi \
            tests.test_q8_0_expert tests.test_native_q8_0_expert tests.test_q8_0_integration \
            tests.test_q8_0_olmoe tests.test_q4_0_expert tests.test_native_q4_0_expert \
            tests.test_q4_0_olmoe tests.test_q4_0_packing_policy tests.test_q4_1_expert \
            tests.test_q4_1_native tests.test_q4_1_olmoe \
            tests.test_q5_0_expert tests.test_native_q5_0_expert tests.test_q5_0_olmoe \
            tests.test_q5_1_expert tests.test_native_q5_1_expert tests.test_q5_1_olmoe \
            tests.test_q5_0_integration_adversarial \
            tests.test_q8_1_expert tests.test_lowbit_expert \
            tests.test_grouped_int4_expert tests.test_native_grouped_int4_expert \
            tests.test_mxfp4_integration tests.test_extended_packed_olmoe \
            tests.test_native_segment_executor tests.test_native_olmoe_segments \
            tests.test_native_segment_adversarial tests.test_native_mixtral \
            tests.test_native_leased_olmoe_segments tests.test_native_olmoe_cli \
            tests.test_engine_source_packaging tests.test_engine_public_surface
      - name: Check identity inventory separately from hardware certification
        run: python -m unittest tests.test_family_conformance -v

  exact-family-oracles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated exact-family oracle
        run: python -m pip install 'numpy>=1.26,<3' 'torch>=2.6,<3' 'transformers==5.16.1' 'safetensors>=0.6,<1'
      - name: Prepare checksum-pinned Kimi oracle sources
        run: python -m tests.prepare_kimi_oracle .tmp-kimi-oracle
      - name: Compare compiled CPU decoders with exact model oracles
        shell: bash
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          KIMI_LINEAR_ORACLE_DIR: .tmp-kimi-oracle
        run: |
          python - <<'PY'
          import unittest
          from tests.test_platform_certification_runner import run_certification
          names = [
              'tests.test_independent_glm_dsa',
              'tests.test_native_glm_dsa',
              'tests.test_native_mixtral_qwen35',
              'tests.test_native_mixtral_delta',
              'tests.test_native_qwen35',
              'tests.test_independent_qwen4',
              'tests.test_native_checkpoint',
              'tests.test_native_glm5_next',
              'tests.test_native_deepseek_v4',
              'tests.test_native_inkling',
              'tests.test_native_kimi',
              'tests.test_native_mixtral_decoder',
              'tests.test_native_qwen35_vision',
              'tests.test_native_multimodal_checkpoint',
              'tests.test_native_deepseek_v41_csa2',
              'tests.test_native_kimi_k3_attnres',
              'tests.test_native_kimi_k3_decoder',
              'tests.test_native_kimi_k3_kda',
              'tests.test_native_kimi_k3_moe',
              'tests.test_native_kimi_k3_hybrid',
              'tests.test_native_kimi_k3_dense_hybrid',
              'tests.test_native_kimi_k3_checkpoint',
              'tests.test_native_deepseek_v41_quant',
              'tests.test_native_deepseek_v41_index',
              'tests.test_native_deepseek_v41_ced',
              'tests.test_native_deepseek_v41_checkpoint',
              'tests.test_native_mxfp4',
              'tests.test_native_deepseek_v41_engram',
              'tests.test_native_deepseek_v41_mhc',
              'tests.test_native_kimi_k3_vendor_checkpoint',
              'tests.test_prepare_kimi_oracle',
          ]
          raise SystemExit(run_certification(unittest.defaultTestLoader.loadTestsFromNames(names)))
          PY
