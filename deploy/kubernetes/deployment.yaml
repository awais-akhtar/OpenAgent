apiVersion: apps/v1
kind: Deployment
metadata:
  name: openagent
  namespace: openagent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openagent
  template:
    metadata:
      labels:
        app: openagent
    spec:
      serviceAccountName: openagent
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openagent
          image: ghcr.io/awais-akhtar/openagent:0.13.0
          imagePullPolicy: Always
          command:
            - python
            - -m
            - openagent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8765"
            - --data-dir
            - /data
          envFrom:
            - configMapRef:
                name: openagent-config
          env:
            - name: OPENAGENT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openagent-secrets
                  key: bootstrap-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8765
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openagent-data
        - name: temp
          emptyDir:
            sizeLimit: 256Mi
