apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagent-same-namespace
  namespace: openagent
spec:
  podSelector:
    matchLabels:
      app: openagent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8765
