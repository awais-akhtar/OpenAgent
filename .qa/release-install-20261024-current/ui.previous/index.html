<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />

    <title>OpenAgent</title>
    <script type="module" crossorigin src="/app.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-vendor-BHFtu1-k.js">
    <link rel="modulepreload" crossorigin href="/assets/motion-vendor-CBMtfQht.js">
    <link rel="modulepreload" crossorigin href="/assets/router-vendor-GbRTpPLo.js">
    <link rel="stylesheet" crossorigin href="/styles.css">

  <body>
    <div id="root">
      <div id="openagent-startup-placeholder" role="status" style="min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#374151;background:#f6f8fc;padding:32px;text-align:center">
        Opening OpenAgent…
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var placeholder = document.getElementById('openagent-startup-placeholder');
        if (placeholder) {
          placeholder.setAttribute('role', 'alert');
          placeholder.textContent = 'OpenAgent could not load its interface. Check that the desktop UI files are installed and open the browser developer console for details.';
        }
      }, 12000);
    </script>
